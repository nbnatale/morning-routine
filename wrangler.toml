name = "morning-routine"
main = "src/worker/index.ts"
compatibility_date = "2026-06-23"
tsconfig = "tsconfig.worker.json"

[assets]
directory = "./dist"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# D1 and KV are not used until Phase 3 (backend / auth).
# Uncomment and fill in real IDs after running:
#   wrangler d1 create morning-routine-db
#   wrangler kv namespace create SESSIONS
# See CLOUDFLARE_DEPLOYMENT_GUIDE.md for the full provisioning steps.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "morning-routine-db"
# database_id = "PASTE_THE_D1_ID_HERE"
#
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "PASTE_THE_KV_ID_HERE"
