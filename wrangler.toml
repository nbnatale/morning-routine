name = "morning-routine"
main = "src/worker/index.ts"
compatibility_date = "2026-06-23"
tsconfig = "tsconfig.worker.json"

[assets]
directory = "./dist"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# Fill in real IDs after running wrangler d1 create / wrangler kv namespace create
# See CLOUDFLARE_DEPLOYMENT_GUIDE.md for the provisioning steps.
[[d1_databases]]
binding = "DB"
database_name = "morning-routine-db"
database_id = "PLACEHOLDER_D1_ID"

[[kv_namespaces]]
binding = "SESSIONS"
id = "PLACEHOLDER_KV_ID"
